name: Awake
description: 'Awake Security was a cybersecurity company founded in 2014 and headquartered
  in Sunnyvale, California, backed by Greylock Partners. Its network detection and response
  (NDR) platform applied network traffic analysis, behavioral modeling, and entity
  resolution to surface malicious activity, insider threats, and compromised devices
  across enterprise, IoT, and cloud environments without requiring endpoint agents.
  Arista Networks acquired Awake Security in October 2020 and the technology now ships
  as Arista NDR. This company profile was surfaced as a Greylock portfolio lead and
  added to the API Evangelist network for enrichment; the standalone awakesecurity.com
  domain is behind a bot-challenge and publishes no public API, developer portal, or
  machine-readable specification.'
